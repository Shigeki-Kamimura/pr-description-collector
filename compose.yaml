services:
  certgen:
    image: alpine:3.20
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache openssl >/dev/null
        mkdir -p /certs
        if [ ! -f /certs/dev.crt ] || [ ! -f /certs/dev.key ]; then
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout /certs/dev.key \
            -out /certs/dev.crt \
            -days 3650 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
        fi
    volumes:
      - nginx-certs:/certs
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required for docker compose}
      REDIS_URL: redis://redis:6379/0
      # GitHub 認証（少なくともどれか1つを設定）
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_PAT: ${GITHUB_PAT:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_REQUEST_TIMEOUT_SECONDS: ${GITHUB_REQUEST_TIMEOUT_SECONDS:-}
      ONEDRIVE_TENANT: ${ONEDRIVE_TENANT:-}
      ONEDRIVE_CLIENT_ID: ${ONEDRIVE_CLIENT_ID:?ONEDRIVE_CLIENT_ID is required for docker compose}
      ONEDRIVE_CLIENT_SECRET: ${ONEDRIVE_CLIENT_SECRET:?ONEDRIVE_CLIENT_SECRET is required for docker compose}
      ONEDRIVE_REDIRECT_URI: ${ONEDRIVE_REDIRECT_URI:?ONEDRIVE_REDIRECT_URI is required for docker compose}
      ONEDRIVE_BASE_FOLDER: ${ONEDRIVE_BASE_FOLDER:-}
      ONEDRIVE_WORK_FOLDER: ${ONEDRIVE_WORK_FOLDER:-}
      ONEDRIVE_TRUST_X_FORWARDED_PROTO: "true"
      ONEDRIVE_TRUSTED_PROXY_HOSTS: localhost:${COMPOSE_PUBLIC_PORT:-5173},127.0.0.1:${COMPOSE_PUBLIC_PORT:-5173}
    user: "node"
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${COMPOSE_PUBLIC_PORT:-5173}:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-certs:/certs:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
      app:
        condition: service_healthy

volumes:
  redis-data:
  nginx-certs:
