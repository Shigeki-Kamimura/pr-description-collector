server {
    listen 80;
    server_name localhost 127.0.0.1;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost 127.0.0.1;

    ssl_certificate /certs/dev.crt;
    ssl_certificate_key /certs/dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # compose の DNS を使って upstream を実行時に解決する（起動時の一発解決で落ちるのを防ぐ）。
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $app_upstream http://app:3000;

    location / {
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        # 保存やGitHub取得が60秒超えるケースがあるため、タイムアウトを延長する。
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # 公開側の host:port をそのまま upstream に渡し、OAuth の HTTPS 判定と整合させる。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
